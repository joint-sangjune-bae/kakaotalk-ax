[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kakaotalk-ax"
version = "0.9.0"
description = "KakaoTalk native macOS Accessibility reading, navigation and sending via CLI and MCP"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

[project.optional-dependencies]
mcp = ["mcp>=1.30,<2"]
dev = ["PyYAML>=6,<7"]
windows-probe = ["pywinauto==0.6.9; sys_platform == 'win32'"]

[project.scripts]
kax = "kakaotalk_automation:main"
kax-win-probe = "kakaotalk_windows_probe:main"

[tool.setuptools]
py-modules = ["kakaotalk_mcp", "kakaotalk_automation", "kakaotalk_ax", "kakaotalk_state", "kakaotalk_windows_probe"]
packages = ["kakaotalk_native"]

[tool.setuptools.package-data]
kakaotalk_native = ["*.swift"]

[tool.setuptools.package-dir]
"" = "src"
