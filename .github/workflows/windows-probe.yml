name: Windows accessibility probe

on:
  push:
    paths:
      - .github/workflows/windows-probe.yml
      - pyproject.toml
      - src/kakaotalk_windows_probe.py
      - tests/test_windows_probe.py
  pull_request:
    paths:
      - .github/workflows/windows-probe.yml
      - pyproject.toml
      - src/kakaotalk_windows_probe.py
      - tests/test_windows_probe.py

permissions:
  contents: read

jobs:
  windows-probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install Windows probe dependencies
        run: python -m pip install -e ".[windows-probe]"
      - name: Import the real Windows dependencies
        run: python -c "import pywinauto; import kakaotalk_windows_probe"
      - name: Run synthetic probe tests
        run: python -m unittest discover -s tests -p test_windows_probe.py -v
      - name: Check the installed CLI without a KakaoTalk window
        run: >-
          python -c "import json, subprocess;
          r = subprocess.run(['kax-win-probe', '--window-handle', '0x1'], capture_output=True, text=True, timeout=30);
          assert r.returncode == 1, r.returncode;
          value = json.loads(r.stdout);
          assert value['reason'] in ('top_level_window_or_process_unavailable', 'target_process_mismatch'), value['reason'];
          assert value['messageTextRead'] is False"
